version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing backend dependencies...
      - npm install

      - echo Installing frontend dependencies...
      - cd frontend
      - npm install
      - cd ..

  build:
    commands:
      - echo Building React frontend...
      - cd frontend
      - npm run build
      - cd ..
      - echo Build completed successfully

artifacts:
  files:
    - '**/*'

cache:
  paths:
    - node_modules/**/*
    - frontend/node_modules/**/*
