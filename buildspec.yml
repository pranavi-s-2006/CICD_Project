version: 0.2

env:
  variables:
    PORT: "5000"
    NODE_ENV: "production"
    MONGODB_URI: "mongodb+srv://pranaviprans976_db_user:pyqSJlELB2PgvxcK@cluster0.d1bvei1.mongodb.net/focusloom?retryWrites=true&w=majority"
    JWT_SECRET: "focusloom-jwt-secret-2024-production"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing backend dependencies...
      - npm install
      - echo Installing frontend dependencies...
      - cd frontend && npm install && cd ..

  pre_build:
    commands:
      - echo Writing .env file...
      - echo PORT=5000 > .env
      - echo NODE_ENV=production >> .env
      - echo MONGODB_URI=mongodb+srv://pranaviprans976_db_user:pyqSJlELB2PgvxcK@cluster0.d1bvei1.mongodb.net/focusloom?retryWrites=true&w=majority >> .env
      - echo JWT_SECRET=focusloom-jwt-secret-2024-production >> .env
      - echo Testing MongoDB connection...
      - node -e "const mongoose=require('mongoose');mongoose.connect(process.env.MONGODB_URI).then(()=>{console.log('MongoDB Connected');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"

  build:
    commands:
      - echo Building React frontend...
      - cd frontend && npm run build && cd ..
      - echo Build completed on `date`

  post_build:
    commands:
      - echo Post build completed successfully

artifacts:
  files:
    - server.js
    - package.json
    - package-lock.json
    - Procfile
    - .env
    - routes/**/*
    - models/**/*
    - middleware/**/*
    - utils/**/*
    - frontend/build/**/*
  discard-paths: no
